{% extends "base.html" %}
{% block title %}Sign up — {{ site_name }}{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="auth-subtitle">Start buying and selling digital assets on {{ site_name }}.</p>

        <form method="post" class="auth-form" novalidate>
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" required autofocus
                       value="{{ name | default('', true) }}"
                       placeholder="Alex Rivera">
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required
                       value="{{ email | default('', true) }}"
                       placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       minlength="8"
                       placeholder="At least 8 characters">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
