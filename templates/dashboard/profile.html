{% extends "base.html" %}
{% block title %}Edit profile — {{ site_name }}{% endblock %}

{% block content %}
<div class="form-page">
    <h1 class="form-page-title">Edit profile</h1>
    <p class="form-page-subtitle">Your name and bio appear on the listings you sell.</p>

    <form method="post" class="profile-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <section class="form-section">
            <div class="form-group">
                <label for="name">Display name</label>
                <input type="text" id="name" name="name" required maxlength="120"
                       value="{{ name | default('', true) }}"
                       placeholder="Your name">
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="5"
                          placeholder="A sentence or two about what you build and sell.">{{ bio | default('', true) }}</textarea>
            </div>
        </section>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-ghost">Back to dashboard</a>
        </div>
    </form>
</div>
{% endblock %}
